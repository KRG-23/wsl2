name: Validate workstation automation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y age zsh
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/bootstrap-debian.sh && zsh -n files/devops-tools.zsh && zsh -n files/migration-tools.zsh
      - run: ansible-playbook --syntax-check site.yml
      - name: Parse PowerShell without executing provisioning
        shell: pwsh
        run: |
          Get-ChildItem windows/* -Include *.ps1,*.psm1 | ForEach-Object {
            $parseErrors = $null; $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          ./tests/test-windows.ps1
