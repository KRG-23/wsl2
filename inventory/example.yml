# Surcharges seulement : valeurs communes dans inventory/group_vars/all.yml.
# Charger avec -i inventory/hosts.yml ; ce fichier ne remplace pas un inventaire.
# Copier vers inventory/local.yml (ignoré par Git) ou utiliser scripts/configure.py.
workstation_profile: base
workstation_user: developer
workstation_uid: 1000
workstation_gid: 1000
windows_home: /mnt/c/Users/YOUR_WINDOWS_USER
git_name: ''
git_email: ''
enable_docker: true
enable_terraform: true
enable_node: true
enable_uv: true
enable_bedrock: false
enable_corporate_ca: false
enable_aws_windows_link: false
enable_azure_windows_link: false
enable_local_autostart: false
extra_apt_packages: []
